name: Сборка CodeRise для Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить зависимости
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Собрать exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CodeRise --add-data "coderise/data/*.json;coderise/data" main.py
      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: CodeRise-Windows
          path: dist/CodeRise.exe
          if-no-files-found: error
          retention-days: 14
